# main に push すると、public/（画面）を GitHub Pages に公開する。
# 公開の前に画面の JS の書き方の誤りを確かめ、誤りがあれば公開しない（真っ白な画面を出さないため）。
# 初回だけ、リポジトリの Settings > Pages の Source を「GitHub Actions」にしておく（docs/公開手順.md）。
name: 画面を GitHub Pages に公開

on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 書き方の確認
        run: for f in public/*.js; do node --check "$f"; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
