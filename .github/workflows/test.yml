# プルリクエストと push のたびに、store.js のテスト（npm test）と、画面とサーバーの JS の書き方の確認を流す
name: テスト

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: 書き方の確認
        run: for f in public/*.js src/*.js; do node --check "$f"; done
